services:
  app:
    container_name: app
    build:
      context: ./app
      dockerfile: dockerFile
    environment:
      # - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 3000:3000
    networks:
      - goods_deals
  api:
    container_name: api
    build:
      context: ./api
      dockerfile: dockerFile
    volumes:
      - ./api:/usr/src/api
      - /usr/src/api/node_modules
    ports:
      - 3001:3001
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PORT=3001
    networks:
      - goods_deals

  db:
    container_name: db
    image: postgres:16
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - 5432:5432
    networks:
      - goods_deals

  prisma-studio:
    image: node:lts-alpine3.17
    working_dir: /usr/src/api
    volumes:
      - ./api/prisma:/usr/src/api/prisma
    command: npx prisma studio
    ports:
      - "5555:5555"
    env_file:
      - .env
    networks:
      - goods_deals
    depends_on:
      - db
  adminer:
    container_name: adminer
    image: adminer
    env_file:
      - .env
    ports:
      - 8080:8080
    networks:
      - goods_deals

networks:
  goods_deals:
    driver: bridge
